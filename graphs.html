<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graphs</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="graph.css">
</head>
<body>


    <header>
        <div class="logo">
            AI Control
        </div>

        <nav>
            <a href="index.html" class="nav-link">Detection Model</a>
            <a href="#" class="nav-link">Analysis DashBoard</a>
        </nav>

    </header>

    <main class="container">

        <div class="group">

            <div class="graph">
                <img src="graphs/importance.png" alt="">
                <p>Most Important Features</p>
            </div>

            <div class="graph">
                <img src="graphs/totcalls.png" alt="">
                <p>Total Calls</p>
            </div>


        </div>

        <div class="group">

            <div class="graph">
                <img src="graphs/avg vs month minues.png" alt="">
                <p>Avrage Vs Month Minutes</p>
            </div>

            <div class="graph">
                <img src="graphs/month vs change mou.png" alt="">
                <p>Months Vs Change Month</p>
            </div>


        </div>


        <div class="group">

            <div class="graph">
                <img src="graphs/bar-eqpdays.png" alt="">
                <p>Bar Of Eqpdays vs Total Calls</p>
            </div>

            <div class="graph">
                <img src="graphs/eqpdays.png" alt="">
                <p>Distribution Of Eqpdays</p>
            </div>


        </div>




        <div class="group">

            <div class="graph">
                <img src="graphs/mou_mean.png" alt="">
                <p>Mounth Mean</p>
            </div>

            <div class="graph">
                <img src="graphs/months.png" alt="">
                <p>Months</p>
            </div>


        </div>



    </main>

    
</body>
</html>
